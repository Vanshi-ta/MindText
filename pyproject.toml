[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindtext"
version = "0.1.0"
description = "Reproducible classification of mental-health-related text and acoustic-feature data (research/educational; not diagnostic)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.0"]
nlp = ["nltk>=3.8"]
app = ["streamlit>=1.30"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
mindtext = "mindtext.cli:main"

[tool.setuptools.packages.find]
include = ["mindtext*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
