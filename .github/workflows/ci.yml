name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check mindtext tests
      - name: Import check
        run: python -c "import mindtext, mindtext.cli, mindtext.training, mindtext.ingest; print(mindtext.__version__)"
      - name: Unit tests
        run: pytest
      - name: Synthetic smoke test (no external data)
        run: |
          mindtext make-sample --task text --out /tmp/s_text.csv
          mindtext make-sample --task tabular --out /tmp/s_tab.csv
          mindtext data-check --data /tmp/s_text.csv
          mindtext train --config configs/default.yaml --data /tmp/s_text.csv
          mindtext train --config configs/acoustic.yaml --data /tmp/s_tab.csv
          mindtext predict --model artifacts/model.joblib --input /tmp/s_tab.csv
          mindtext report --latest
